<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Farol — receptor</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #0e1116; color: #e6edf3;
        display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 2rem 1rem;
      }
      h1 { margin: 0; font-size: 1.3rem; }
      p, pre { margin: 0; color: #9aa7b4; text-align: center; }
      a { color: #2f81f7; }
      button { background: #2f81f7; color: #fff; border: 0; border-radius: 8px; padding: 0.55rem 1.1rem; font-size: 1rem; cursor: pointer; }
      video.camera { width: min(90vmin, 480px); height: auto; background: #000; border-radius: 6px; }
      progress { width: min(90vmin, 480px); height: 14px; }
      #result { text-align: center; }
      #result a { color: #2f81f7; }
    </style>
  </head>
  <body>
    <h1>Farol — receptor (câmera)</h1>
    <p>Aponte para a tela transmissora (página <a href="/send/">Transmitir</a>).</p>
    <button id="start">Iniciar câmera</button>
    <video id="camera" class="camera" playsinline muted></video>
    <progress id="prog" max="1" value="0"></progress>
    <pre id="status">toque em "Iniciar câmera".</pre>
    <div id="result"></div>
    <script type="module" src="/app/receive/main.ts"></script>
  </body>
</html>
