<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Farol</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; font: 16px/1.5 system-ui, sans-serif;
        background: #0e1116; color: #e6edf3;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1.5rem;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
      }
      h1 { margin: 0; font-size: 2rem; letter-spacing: 0.02em; }
      p.lead { margin: 0; max-width: 32rem; text-align: center; color: #9aa7b4; }
      .menu { display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 26rem; }
      .card {
        display: flex; flex-direction: column; gap: 0.2rem; text-decoration: none;
        background: #161b22; border: 1px solid #30363d; border-radius: 14px;
        padding: 1.25rem 1.4rem; color: #e6edf3; transition: background 0.1s;
      }
      .card:active { background: #1c232c; }
      .card .emoji { font-size: 1.6rem; }
      .card strong { font-size: 1.25rem; }
      .card small { color: #9aa7b4; }
      footer { color: #6b7684; font-size: 0.85rem; text-align: center; }
      footer a { color: #2f81f7; }
    </style>
  </head>
  <body>
    <h1>Farol</h1>
    <p class="lead">Transferência de arquivos por luz — tela para câmera, sem rede.</p>
    <nav class="menu">
      <a class="card" href="send/index.html">
        <span class="emoji">📤</span>
        <strong>Transmitir</strong>
        <small>Escolha um arquivo; a tela vira um QR animado.</small>
      </a>
      <a class="card" href="receive/index.html">
        <span class="emoji">📷</span>
        <strong>Receber</strong>
        <small>Aponte a câmera para a tela transmissora.</small>
      </a>
    </nav>
    <footer><a href="demo/index.html">demo loopback (teste sem câmera)</a></footer>
  </body>
</html>
